<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#19191c">
  <title>Пойдёшь? — Калиновская</title>
  <meta name="description" content="Несколько минут вместе. Прогулка с Калиновской, «Провожать закаты» и встреча 1 ноября в Москве.">
  <meta property="og:title" content="Пойдёшь? — Калиновская"><meta property="og:description" content="Хочу кое-что тебе показать. Пойдём смотреть на вечерний город?">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%2319191c'/%3E%3Cpath d='M7 19a9 9 0 0 1 18 0' fill='%23f5b978'/%3E%3Cpath d='M5 23h22' stroke='%23f4e8d8' stroke-width='2'/%3E%3C/svg%3E">
  <link rel="preload" as="image" href="assets/sky.webp"><link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="scenery" aria-hidden="true"><div id="backdrop" class="backdrop"></div><div class="shade"></div><div class="grain"></div></div>
  <main class="layout">
    <section class="chat" aria-label="Прогулка с Виолеттой">
      <header class="masthead">
        <div class="masthead-row">
          <div class="artist-lockup"><p class="song-kicker">Провожать закаты</p><h1>Калиновская</h1></div>
          <div class="chat-tools"><button id="theme-toggle" class="icon-button" aria-label="Включить светлую тему" title="Включить светлую тему"></button><button id="restart" class="icon-button" aria-label="Начать прогулку заново" title="Начать заново">↺</button></div>
        </div>
        <div class="event-meta"><span>Концерт · 01.11.2026 · 20:00</span><span>Москва · Cafe Unlock</span></div>
        <div id="story-progress" class="story-progress" role="progressbar" aria-label="Этапы нашей прогулки" aria-valuemin="1" aria-valuemax="4" aria-valuenow="1" aria-valuetext="Пойдёшь со мной?" data-stage="1"><span></span><span></span><span></span><span></span></div>
        <span id="scene-heading" class="sr-only">Пойдёшь со мной?</span><span id="chat-status" class="sr-only">зовёт на прогулку</span>
      </header>
      <div class="conversation" id="conversation" tabindex="0" role="log" aria-live="polite" aria-relevant="additions"></div>
      <div id="choices" class="choices" aria-label="Твой ответ"></div>
    </section>
  </main>
  <audio id="song" src="assets/provozhat-zakaty-37s.mp3" preload="none"></audio>
  <dialog id="photo-dialog"><button id="close-photo" class="dialog-close" aria-label="Закрыть фотографию">×</button><img id="large-photo" src="assets/sky.webp" alt="Солнце садится над городом"><p>можно просто посмотреть</p></dialog>
  <div id="quiet-mode" class="quiet-mode" hidden><p>побудем здесь</p><button id="return-chat">Вернуться к разговору</button><button id="quiet-pause" class="quiet-pause">Пауза</button></div>
  <div id="announcement" class="announcement" role="status" aria-live="polite"></div>
  <script src="app.js"></script>
</body>
</html>
